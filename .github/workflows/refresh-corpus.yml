# ---------------------------------------------------------------------------
# Monthly corpus refresh
#
# Re-harvests PubMed, rebuilds the site and the NotebookLM source pack, and
# opens a pull request describing what changed.  Nothing lands on main without
# a human merging the PR, so the published site never moves on its own.
#
# Requires:
#   - repository secret  NCBI_API_KEY
#   - library/  committed, so there is a baseline to diff against
#   - pipeline/ci_refresh_report.py
# ---------------------------------------------------------------------------

name: Monthly corpus refresh

on:
  schedule:
    # 04:00 America/Los_Angeles on the 1st of each month (11:00 UTC).
    # GitHub cron is always UTC; this drifts one hour with daylight saving.
    - cron: "0 11 1 * *"
  workflow_dispatch:
    inputs:
      triage_limit:
        description: >-
          Max records sent to the agent this run. 0 = rebuild the site and
          exports from summaries already in the library, with no API spend.
        required: false
        default: "120"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: corpus-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Triage runs at roughly 7 records per 90 s, so 120 records needs about
    # 30 minutes on top of harvest and build. 90 leaves real headroom rather
    # than finishing just under the wire, as run 13 failed to do at 60.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl

      - name: Fail early if the baseline corpus is missing
        run: |
          if [ ! -f library/flash_library.json ]; then
            echo "::error::library/flash_library.json is not committed."
            echo "Without a baseline every record would be reported as new."
            exit 1
          fi

      - name: Snapshot the current corpus
        run: python pipeline/ci_refresh_report.py snapshot .refresh/before.json

      - name: Harvest PubMed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        # The API key only raises the NCBI rate limit from 3 to 10 requests/s.
        # A rejected key should therefore slow this job down, not kill it - so if
        # the authenticated harvest fails, retry once without the key and warn.
        run: |
          if python pipeline/flash_harvest.py; then
            exit 0
          fi
          echo "::warning::Harvest failed with NCBI_API_KEY set - retrying unauthenticated."
          echo "If this warning appears, check the NCBI_API_KEY secret: the harvest is"
          echo "now running at the lower anonymous rate limit (3 req/s)."
          env -u NCBI_API_KEY python pipeline/flash_harvest.py

      - name: Recall guard — landmark papers must survive the harvest
        # Asserts that known FLASH landmarks are still in the corpus and that
        # known homonyms are still excluded. A query or screening regression
        # fails the build here, BEFORE any pull request is opened, instead of
        # silently shrinking the corpus. See pipeline/test_recall.py.
        run: python3 pipeline/test_recall.py

      - name: Agent triage — category, summary, contradiction flags
        # Model-assigned category, a written summary, and flags where a paper
        # contradicts an assertion in library/claims.yml. Placed after the
        # recall guard so a query or screening regression fails before any API
        # spend. Only touches records the keyword model left in a content
        # category or Uncategorized -- publication-type routing is preserved,
        # and the keyword category is kept as category_keyword so every
        # disagreement shows up in the pull request body. TRIAGE_LIMIT caps
        # records per run, so the untriaged backlog drains over several months
        # rather than arriving as one large bill.
        #
        # continue-on-error: an Anthropic outage or an expired key must not cost
        # the month's corpus refresh. The deterministic half of this pipeline --
        # harvest, recall guard, build, RIS export, NotebookLM pack -- does not
        # depend on the model, so it still runs and the PR still opens, with a
        # notice at the top saying triage was skipped. Records missed this run
        # are picked up next run, because a PMID is triaged exactly once.
        id: triage
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Scheduled runs get the default; manual runs can dial it down (or to
          # 0) from the Run workflow form without editing this file.
          TRIAGE_LIMIT: ${{ inputs.triage_limit || '120' }}
        run: python3 pipeline/triage_agent.py
      - name: Rebuild deliverables and site source
        run: python pipeline/build_site.py

      - name: Seed NotebookLM delta state on first run
        # build_notebooklm.py diffs against notebooklm_sources/_seen_pmids.json to
        # decide what is new. With no state file it writes no delta at all, so the
        # first run would silently produce nothing to upload. Seeding from the
        # pre-harvest snapshot makes that first delta correct.
        run: |
          if [ ! -f notebooklm_sources/_seen_pmids.json ]; then
            mkdir -p notebooklm_sources
            python -c "import json; b=json.load(open('.refresh/before.json')); json.dump({'updated':'seeded','pmids':sorted(b)}, open('notebooklm_sources/_seen_pmids.json','w')); print('seeded delta state with', len(b), 'PMIDs')"
          fi

      - name: Rebuild NotebookLM source pack
        # Regenerates the 11 category files and writes
        # notebooklm_sources/monthly_additions/FLASH_NEW_<date>.md containing only
        # the papers added this run - that one file is the monthly upload.
        run: python pipeline/build_notebooklm.py

      - name: Sync generated site into the repository root
        # build_site.py writes to website/mkdocs_source/, but deploy.yml builds
        # from the repo root (mkdocs.yml + docs/). Keep the two in step.
        run: |
          rsync -a --delete website/mkdocs_source/docs/ docs/
          cp website/mkdocs_source/mkdocs.yml mkdocs.yml

      - name: Build the change report
        id: report
        run: |
          python pipeline/ci_refresh_report.py report .refresh/before.json .refresh/pr_body.md
          # Append the triage section -- contradiction flags, category
          # disagreements, low-confidence records -- so it lands in the pull
          # request body alongside the corpus diff.
          if [ "${{ steps.triage.outcome }}" != "success" ]; then
            {
              echo
              echo "## :warning: Agent triage did not run"
              echo
              echo "The triage step failed and was skipped. This refresh is"
              echo "**keyword-categorized only** -- no agent summaries,"
              echo "category review or contradiction flags for the new records."
              echo
              echo "Everything else is unaffected: the corpus, RIS exports and"
              echo "the NotebookLM pack do not depend on the model. Records"
              echo "missed here are triaged on the next run automatically."
              echo
              echo "Most likely cause is the \`ANTHROPIC_API_KEY\` secret."
              echo "Step log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } >> .refresh/pr_body.md
          elif [ -f .refresh/triage_report.md ]; then
            cat .refresh/triage_report.md >> .refresh/pr_body.md
          fi

          # ci_refresh_report.py sets `changed` from records added/dropped only.
          # That misses the other reason this run may need a PR: a change to the
          # builders or templates that alters generated output while the corpus
          # itself is identical. Without this, a code change can never reach the
          # published site through the monthly workflow -- the rebuild happens in
          # the runner and is thrown away. Re-assert `changed` if any tracked
          # output file actually differs. Last write to $GITHUB_OUTPUT wins, and
          # this only ever flips false -> true.
          if [ -n "$(git status --porcelain -- docs/ library/ mkdocs.yml notebooklm_sources/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Tracked output files differ - a pull request is needed."
            git status --porcelain -- docs/ library/ mkdocs.yml notebooklm_sources/ | head -20
          fi

      - name: Open pull request
        if: steps.report.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: corpus/refresh
          delete-branch: true
          title: >-
            Corpus refresh: +${{ steps.report.outputs.added }} /
            -${{ steps.report.outputs.dropped }}
            (${{ steps.report.outputs.total }} records)
          body-path: .refresh/pr_body.md
          labels: corpus-refresh
          add-paths: |
            library/**
            docs/**
            mkdocs.yml
            pipeline/**
            notebooklm_sources/**
          commit-message: |
            Monthly corpus refresh

            +${{ steps.report.outputs.added }} added,
            -${{ steps.report.outputs.dropped }} dropped,
            ${{ steps.report.outputs.total }} total records.

      - name: Report no-op
        if: steps.report.outputs.changed != 'true'
        run: echo "No records added or dropped this month - no pull request opened."
