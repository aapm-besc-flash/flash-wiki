# FLASH Wiki taxonomy. Mirrors the 11 categories used by the PubMed pipeline
# and the NotebookLM sources. The scope text is passed to the triage model
# verbatim, so it does the real work of placing a paper correctly.

domains:
  radiobiology:
    label: Radiobiology
    scope: >-
      Biological response to ultra-high dose rate irradiation. Normal-tissue
      sparing and tumour iso-effectiveness, in vitro and in vivo endpoints,
      oxygen depletion and radiolytic chemistry measured experimentally, DNA
      damage and repair, immune and vascular response, cell survival assays.
      Use for experimental biology; use modeling_mechanisms when the paper is
      primarily a computational or theoretical mechanism study.
  physics_dosimetry:
    label: Physics & Dosimetry
    scope: >-
      Measurement and characterisation of UHDR beams. Detector response and
      ion recombination, dosimeter development and benchmarking, calorimetry,
      film and gel dosimetry, reference dosimetry protocols, beam monitoring,
      Monte Carlo dose calculation, dose-rate metrics and their definitions,
      quality assurance of FLASH delivery.
  beam_delivery:
    label: Beam Delivery & Technology
    scope: >-
      Machines and hardware that produce UHDR beams. Linac conversion and
      dedicated FLASH accelerators, electron, proton and very-high-energy
      electron (VHEE) systems, laser-driven and X-ray FLASH sources, pulse
      structure and control electronics, beamline design, safety interlocks.
  treatment_planning:
    label: Treatment Planning & Optimization
    scope: >-
      Planning and optimisation for FLASH delivery. Dose-rate-aware objectives,
      FLASH-effect-weighted plan optimisation, conformal FLASH and transmission
      proton planning, shoot-through techniques, comparative planning studies,
      TPS development and dose-rate calculation algorithms.
  clinical_translational:
    label: Clinical & Translational
    scope: >-
      Human and veterinary application. First-in-human and clinical trials,
      case reports, canine and feline patient studies, workflow and protocol
      development for clinical FLASH, regulatory and implementation pathways,
      toxicity outcomes in treated patients.
  modeling_mechanisms:
    label: Modeling & Mechanisms
    scope: >-
      Computational and theoretical work explaining the FLASH effect. Chemical
      kinetics and radiolysis simulation, oxygen depletion models, track
      structure and microdosimetric modelling, mechanistic hypotheses tested in
      silico, mathematical models of normal-tissue sparing.
  reviews_consensus:
    label: Reviews & Consensus
    scope: >-
      Systematic and narrative reviews, task-group and society reports,
      consensus statements, recommendations and roadmaps, scoping reviews of
      the FLASH literature.
  perspectives_commentary:
    label: Perspectives & Commentary
    scope: >-
      Invited perspectives, editorials, news-and-views and commentary that
      frame the field but do not present a formal debate position or new data.
  opinions_debate:
    label: Opinions & Debate
    scope: >-
      Papers arguing an explicit position on a contested question in FLASH,
      for example whether the effect is reproducible, whether a given dose-rate
      threshold is meaningful, or whether clinical translation is premature.
  point_counterpoint:
    label: Point / Counterpoint
    scope: >-
      Formal paired-argument articles, chiefly the Medical Physics and JACMP
      Point/Counterpoint format, where two authors argue opposing sides of a
      stated proposition.
  uncategorized:
    label: Uncategorized
    scope: >-
      FLASH-relevant but not confidently placed in any category above. Use
      sparingly and only when no other domain fits; these are reviewed by hand.
