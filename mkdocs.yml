site_name: FLASH Radiotherapy Living Wiki
site_description: AAPM BESC FLASH Working Group - categorized FLASH-RT literature
# WG members open the built site straight off disk / OneDrive rather than from a
# web server. MkDocs' default "pretty" URLs emit links to directories
# (radiobiology/ served as radiobiology/index.html), which a file:// browser
# cannot resolve - it treats the directory as an unknown download and pops the
# "open with..." dialog. Emitting real .html filenames keeps every link
# clickable offline; GitHub Pages serves them identically.
use_directory_urls: false
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - search.suggest
    - search.highlight
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
extra_css:
  - stylesheets/extra.css
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
nav:
  - Home: index.md
  - Categories:
    - Radiobiology: radiobiology.md
    - Physics & Dosimetry: physics-dosimetry.md
    - Modeling & Mechanisms: modeling-mechanisms.md
    - Beam Delivery & Technology: beam-delivery-technology.md
    - Treatment Planning & Optimization: treatment-planning-optimization.md
    - Clinical & Translational: clinical-translational.md
    - Reviews & Consensus: reviews-consensus.md
    - Opinions & Debate: opinions-debate.md
    - Point-Counterpoint: point-counterpoint.md
    - Perspectives & Commentary: perspectives-commentary.md
    - Uncategorized: uncategorized.md
  - Statistics: statistics.md
  - Methodology: methodology.md
  - Downloads: downloads.md
